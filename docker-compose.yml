services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arh-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-arhautomation.com}
      - ACME_EMAIL=${ACME_EMAIL:-contact@arhautomation.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
